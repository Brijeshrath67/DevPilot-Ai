name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate backend imports
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "from app.main import app; print(app.title)"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: devpilot-ai-backend:${{ steps.version.outputs.VERSION }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: devpilot-ai-frontend:${{ steps.version.outputs.VERSION }}

      - name: Summarize release
        run: |
          echo "DevPilot AI ${{ steps.version.outputs.VERSION }} images built successfully."
          echo "Push images to your container registry and run:"
          echo "  docker compose -f docker/docker-compose.yml up -d"
