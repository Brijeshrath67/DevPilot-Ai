[tool.poetry]
name = "devpilot-ai-backend"
version = "1.0.0"
description = "Backend for DevPilot AI developer productivity platform"
authors = ["DevPilot AI Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.23.1"
sqlalchemy = "^2.0.40"
pydantic = "^2.9.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^0.22.0"
ruff = "^0.16.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `pytest` (console script) import the app package from the backend root.
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["B008"]  # Allow FastAPI Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tests/conftest.py" = ["E402"]  # env vars must be set before app imports
# Mock LLM content ships long user-facing strings; S110 is the documented
# graceful fallback to the offline mock generator.
"app/services/llm_service.py" = ["E501", "S110"]
