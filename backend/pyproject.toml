[tool.poetry]
name = "devpilot-ai-backend"
version = "0.1.0"
description = "Backend for DevPilot AI developer productivity platform"
authors = ["DevPilot AI Team"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.23.1"
sqlalchemy = "^2.0.40"
pydantic = "^2.9.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"

[tool.poetry.dev-dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^0.22.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
