services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: devpilot-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/devpilot.db}
      AI_API_KEY: ${AI_API_KEY:-mock_key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-devpilot_secret_key_12345}
      DATA_ROOT: /app/data
    volumes:
      - devpilot_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: devpilot-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  devpilot_data:
